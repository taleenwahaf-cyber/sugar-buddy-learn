<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Sugar cube background -->
  <defs>
    <linearGradient id="sugarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5e6d3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sugarFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef5e7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8d4b8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circular background -->
  <circle cx="100" cy="100" r="95" fill="#f0f4ff" stroke="#8b7ce8" stroke-width="2"/>
  
  <!-- Sugar cube - top face -->
  <polygon points="70,80 130,80 130,140 70,140" fill="url(#sugarFront)" stroke="#d4a574" stroke-width="2"/>
  
  <!-- Sugar cube - left face -->
  <polygon points="50,100 70,80 70,140 50,120" fill="#deb887" stroke="#c99a7c" stroke-width="2"/>
  
  <!-- Sugar cube - top right face -->
  <polygon points="130,80 150,60 150,120 130,140" fill="#f5deb3" stroke="#d4a574" stroke-width="2"/>
  
  <!-- Highlights for texture -->
  <circle cx="90" cy="100" r="8" fill="rgba(255,255,255,0.6)"/>
  <circle cx="120" cy="95" r="6" fill="rgba(255,255,255,0.4)"/>
  <rect x="75" y="110" width="40" height="2" fill="rgba(255,255,255,0.5)"/>
</svg>
